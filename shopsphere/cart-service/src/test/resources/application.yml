spring:
  application:
    name: cart-service-test
  datasource:
    url: jdbc:h2:mem:shopsphere_cart_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: true
    locations: classpath:db/migration
  # Kafka - explicit here because src/test/resources/application.yml fully replaces
  # (not merges with) src/main/resources/application.properties, so the
  # KAFKA_BOOTSTRAP_SERVERS-with-default expression in main would otherwise never be
  # seen by @SpringBootTest, and Spring Kafka's autoconfigured listener container
  # factory would have no bootstrap-servers value to bind to.
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: shopsphere-cart-service
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest

server:
  port: 0
