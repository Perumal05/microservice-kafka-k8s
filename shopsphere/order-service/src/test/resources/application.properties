spring.application.name=order-service-test

# H2 In-Memory Database Configuration for Tests
spring.datasource.url=jdbc:h2:mem:shopsphere_order_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Flyway Migration Configuration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

server.port=0

# Downstream service URLs - unused directly in unit/slice tests since client beans
# are mocked, but required for RestClientConfig context to start in @SpringBootTest.
shopsphere.services.product.url=http://localhost:4002
shopsphere.services.inventory.url=http://localhost:4005
shopsphere.services.payment.url=http://localhost:4006
shopsphere.services.cart.url=http://localhost:4003
shopsphere.http.connect-timeout-ms=2000
shopsphere.http.read-timeout-ms=3000

# Kafka - explicit here because test/resources/application.properties fully
# replaces (not merges with) src/main/resources/application.properties, so the
# KAFKA_BOOTSTRAP_SERVERS-with-default expression in main would otherwise never
# be seen by @SpringBootTest, and any @Value("${spring.kafka.bootstrap-servers}")
# bean (see KafkaProducerConfig) would fail to start with an unresolved placeholder.
spring.kafka.bootstrap-servers=localhost:9092
