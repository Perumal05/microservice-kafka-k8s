version: "3.8"

services:

  mysql:
    image: mysql:8.0
    container_name: shopsphere-mysql
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    restart: unless-stopped
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - shopsphere-mysql-data:/var/lib/mysql
    networks:
      - shopsphere-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  kafka:
    image: apache/kafka:3.8.0
    container_name: shopsphere-kafka
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      # --- Listeners ---
      # PLAINTEXT is used by every container on shopsphere-network (all seven
      # services, plus kafka-ui) via the hostname "kafka". PLAINTEXT_HOST is
      # for tools running directly on the host machine (e.g. a local kafka
      # CLI, or running a service outside Docker against this same broker).
      KAFKA_LISTENERS: PLAINTEXT://kafka:29092,CONTROLLER://kafka:9093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      # --- Single-node friendly defaults ---
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - shopsphere-kafka-data:/var/lib/kafka/data
    networks:
      - shopsphere-network
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: shopsphere-kafka-ui
    depends_on:
      - kafka
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M
    ports:
      - "9099:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: shopsphere-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    networks:
      - shopsphere-network

  user-service:
    build:
      context: ./user-service
    image: shopsphere/user-service:0.1
    container_name: shopsphere-user-service
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    ports:
      - "4001:4001"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/shopsphere_user?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - shopsphere-network

  product-service:
    build:
      context: ./product-service
    image: shopsphere/product-service:0.1
    container_name: shopsphere-product-service
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    ports:
      - "4002:4002"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/shopsphere_product?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - shopsphere-network

  cart-service:
    build:
      context: ./cart-service
    image: shopsphere/cart-service:0.1
    container_name: shopsphere-cart-service
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    ports:
      - "4003:4003"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/shopsphere_cart?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - shopsphere-network

  order-service:
    build:
      context: ./order-service
    image: shopsphere/order-service:0.1
    container_name: shopsphere-order-service
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    ports:
      - "4004:4004"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/shopsphere_order?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      # Downstream REST URLs - container hostnames instead of localhost.
      PRODUCT_SERVICE_URL: http://product-service:4002
      INVENTORY_SERVICE_URL: http://inventory-service:4005
      PAYMENT_SERVICE_URL: http://payment-service:4006
      CART_SERVICE_URL: http://cart-service:4003
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy
      product-service:
        condition: service_started
    networks:
      - shopsphere-network

  inventory-service:
    build:
      context: ./inventory-service
    image: shopsphere/inventory-service:0.1
    container_name: shopsphere-inventory-service
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    ports:
      - "4005:4005"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/shopsphere_inventory?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - shopsphere-network

  payment-service:
    build:
      context: ./payment-service
    image: shopsphere/payment-service:0.1
    container_name: shopsphere-payment-service
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    ports:
      - "4006:4006"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/shopsphere_payment?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - shopsphere-network

  notification-service:
    build:
      context: ./notification-service
    image: shopsphere/notification-service:0.1
    container_name: shopsphere-notification-service
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    ports:
      - "4007:4007"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/shopsphere_notification?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - shopsphere-network

networks:
  shopsphere-network:
    name: shopsphere-network

volumes:
  shopsphere-kafka-data:
  shopsphere-mysql-data:
