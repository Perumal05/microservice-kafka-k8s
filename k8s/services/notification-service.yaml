apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: shopsphere
  labels:
    app: notification-service
    app.kubernetes.io/name: notification-service
    app.kubernetes.io/part-of: shopsphere
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
        app.kubernetes.io/name: notification-service
        app.kubernetes.io/part-of: shopsphere
    spec:
      containers:
        - name: notification-service
          image: shopsphere/notification-service:0.1
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 4007
              protocol: TCP

          env:
            - name: SERVER_PORT
              value: "4007"

            - name: SPRING_DATASOURCE_URL
              value: "jdbc:mysql://mysql:3306/shopsphere_notification?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC"

            - name: SPRING_DATASOURCE_USERNAME
              value: "root"

            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: shopsphere-secrets
                  key: MYSQL_ROOT_PASSWORD

            - name: KAFKA_BOOTSTRAP_SERVERS
              valueFrom:
                configMapKeyRef:
                  name: shopsphere-config
                  key: KAFKA_BOOTSTRAP_SERVERS

            - name: JAVA_TOOL_OPTIONS
              value: >-
                -XX:MaxRAMPercentage=35
                -XX:InitialRAMPercentage=10
                -Xss256k

          resources:
            requests:
              cpu: "10m"
              memory: "128Mi"
            limits:
              cpu: "300m"
              memory: "300Mi"

          startupProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 40

          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 6

          livenessProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5

---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: shopsphere
  labels:
    app: notification-service
    app.kubernetes.io/name: notification-service
    app.kubernetes.io/part-of: shopsphere
spec:
  type: ClusterIP
  selector:
    app: notification-service
  ports:
    - name: http
      port: 4007
      targetPort: 4007
      protocol: TCP