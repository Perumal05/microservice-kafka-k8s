apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
  namespace: shopsphere
  labels:
    app: payment-service
    app.kubernetes.io/name: payment-service
    app.kubernetes.io/part-of: shopsphere
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payment-service
  template:
    metadata:
      labels:
        app: payment-service
        app.kubernetes.io/name: payment-service
        app.kubernetes.io/part-of: shopsphere
    spec:
      containers:
        - name: payment-service
          image: shopsphere/payment-service:0.1
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 4006
              protocol: TCP

          env:
            - name: SERVER_PORT
              value: "4006"

            - name: SPRING_DATASOURCE_URL
              value: "jdbc:mysql://mysql:3306/shopsphere_payment?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC"

            - name: SPRING_DATASOURCE_USERNAME
              value: "root"

            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: shopsphere-secrets
                  key: MYSQL_ROOT_PASSWORD

            - name: KAFKA_BOOTSTRAP_SERVERS
              valueFrom:
                configMapKeyRef:
                  name: shopsphere-config
                  key: KAFKA_BOOTSTRAP_SERVERS

            - name: JAVA_TOOL_OPTIONS
              value: "-XX:MaxRAMPercentage=60"

          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "300m"
              memory: "350Mi"

          startupProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30

          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6

          livenessProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 5

---
apiVersion: v1
kind: Service
metadata:
  name: payment-service
  namespace: shopsphere
  labels:
    app: payment-service
    app.kubernetes.io/name: payment-service
    app.kubernetes.io/part-of: shopsphere
spec:
  type: ClusterIP
  selector:
    app: payment-service
  ports:
    - name: http
      port: 4006
      targetPort: 4006
      protocol: TCP